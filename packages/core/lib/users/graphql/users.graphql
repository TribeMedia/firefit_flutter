fragment Role on Roles {
  id
  name
  key
}

fragment UserRole on UserRoles {
  id
  roleId
  role {
    ...Role
  }
  userId
}

fragment User on Users {
  id
  email
  firstName
  lastName
  metadata
  did
  handle
  pdsUrl
  createdAt
  userRolesCollection {
    edges {
      node {
        ...UserRole
      }
    }
  }
  primaryStationId
  primaryStation{
    ...Station
  }
  userStationsCollection {
    edges {
      node {
        ...UserStation
      }
    }
  }
}

fragment UserStation on UserStations {
  id
  userId
  stationId
  station {
    ...Station
  }
  createdAt
}

query UserCollection(
  $first: Int
  $last: Int
  $before: Cursor
  $after: Cursor
  $filter: UsersFilter
  $orderBy: [UsersOrderBy!]
) {
  usersCollection(first: $first, last: $last, before: $before, after: $after, filter: $filter, orderBy: $orderBy) {
    edges {
      node {
       ...User
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

query User($id: UUID!) {
  usersCollection(filter: { id: { eq: $id } } ) {
    edges {
      node {
        ...User
      }
    }
  }
}

mutation CreateUser($input: UsersInsertInput!) {
  insertIntoUsersCollection(objects: [$input]) {
    records {
      ...User
    }
  }
}

mutation DeleteUser($id: UUID!) {
  deleteFromUsersCollection(filter: { id: { eq: $id } }) {
    affectedCount
    records {
      ...User
    }
  }
}

mutation AddUserToStation($userId: UUID!, $stationId: UUID!) {
  insertIntoUserStationsCollection(objects: [{ userId: $userId, stationId: $stationId }]) {
    records {
      ...UserStation
    }
  }
}

mutation RemoveUserFromStation($userId: UUID!, $stationId: UUID!) {
  deleteFromUserStationsCollection(
    filter: {
      userId: { eq: $userId }
      stationId: { eq: $stationId }
    }
  ) {
    affectedCount
    records {
      ...UserStation
    }
  }
}

mutation AddUserToRole($userId: UUID!, $roleId: UUID!) {
  insertIntoUserRolesCollection(objects: [{ userId: $userId, roleId: $roleId }]) {
    records {
      ...UserRole
    }
  }
}

mutation RemoveUserFromRole($userId: UUID!, $roleId: UUID!) {
  deleteFromUserRolesCollection(
    filter: {
      userId: { eq: $userId }
      roleId: { eq: $roleId }
    }
  ) {
    affectedCount
    records {
      ...UserRole
    }
  }
}

mutation UpdateUser($id: UUID!, $user: UsersUpdateInput!) {
  updateUsersCollection(
    filter: {
      id: { eq: $id }
    }
    set: $user
  ) {
    records {
      ...User
    }
    affectedCount
  }
}
