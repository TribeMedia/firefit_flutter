fragment NotificationType on NotificationTypes {
id
  key
  name
  iconUrl
  schema
  createdAt
}

fragment Notification on Notifications {
  id
  userId
  notificationTypeId
  notificationType {
    ...NotificationType
  }
  title
  subtitle
  iconUrl
  isRead
  messageMarkdown
  data
  createdAt
}

query NotificationCollection(
  $first: Int, 
  $last: Int, 
  $after: Cursor, 
  $before: Cursor, 
  $filter: NotificationsFilter, 
  $orderBy: [NotificationsOrderBy!]
) {
  notificationsCollection(
    first: $first, 
    last: $last, 
    after: $after, 
    before: $before, 
    filter: $filter, 
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...Notification
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}

query NotificationTypesCollection(
  $first: Int, 
  $last: Int, 
  $after: Cursor, 
  $before: Cursor, 
  $filter: NotificationTypesFilter, 
  $orderBy: [NotificationTypesOrderBy!]
) {
  notificationTypesCollection(
    first: $first, 
    last: $last, 
    after: $after, 
    before: $before, 
    filter: $filter, 
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...NotificationType
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
