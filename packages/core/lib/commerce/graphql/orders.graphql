  $last: Int,
  $before: Cursor,
  $after: Cursor,
  $filter: ShoppingCartsFilter,
  $orderBy: [ShoppingCartsOrderBy!],
) {
  shoppingCartsCollection(
    first: $first,
    last: $last,
    before: $before,
    after: $after,
    filter: $filter,
    orderBy: $orderBy,
  ) {
    edges {
      node {
        ...ShoppingCart
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

