}

fragment SiteDeliveryLocation on SiteDeliveryLocation {
  id
  siteId
  site {
    id
    name
    addressId
    address {
      id
      name
      address
      address1
      city
      state
      zip
    }
  }
  deliveryLocationId
  createdAt
  deliveryLocation {
    ...DeliveryLocation
  }
}

query SiteDeliveryLocationsForSite($siteId: UUID!) {
  siteDeliveryLocationCollection(filter: { siteId: { eq: $siteId } }) {
    edges {
      node {
        ...SiteDeliveryLocation
      }
    }
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
  }
}

query DeliveryPeriod(
  $startDate: Datetime!
  $endDate: Datetime!
) {
  deliveryPeriodCollection(filter: {
    startDate: { gte: $startDate}
    endDate: { lte: $endDate}
  }) {
    edges {
      node {
        ...DeliveryPeriod
      }
    }
  }
}

query DeliveryPeriods(
  $first: Int,
  $last: Int,
  $before: Cursor,
  $after: Cursor,
  $filter: DeliveryPeriodFilter,
  $orderBy: [DeliveryPeriodOrderBy!],
) {
  deliveryPeriodCollection(
    first: $first,
    last: $last,
    before: $before,
    after: $after,
    filter: $filter,
    orderBy: $orderBy,
  ) {
    edges {
      node {
        ...DeliveryPeriod
      }
    }
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
  }
}

query StationWithSiteDeliveryLocationsForPeriod(
  $siteId: UUID!
  $deliveryPeriodId: UUID!
) {
  siteDeliveryLocationCollection(filter: {
    siteId: { eq: $siteId }
  }) {
    edges {
      node {
        id
        siteId
        deliveryLocationId
        createdAt
        deliveryLocation {
          ...DeliveryLocation
        }
        site {
          ...Site
        }
      }
    }
  }
  deliveryPeriodCollection(filter: {id: {eq: $deliveryPeriodId}}) {
    edges {
      node {
        ...DeliveryPeriod
      }
    }
  }
}

query ValidDeliveryLocations($startDate: Datetime!) {
  deliveryLocationCollection(filter: { 
    active: { eq: true } 
    startOpenTime: { gte: $startDate }
    }
    orderBy: [ { startOpenTime: AscNullsLast } ]
    ) {
    edges {
      node {
        ...DeliveryLocation
      }
    }
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
  }
}
