
fragment ShoppingCartItem on ShoppingCartItems {
  id
  shoppingCartId
  productId
  product {
    ...Product
  }
  createdAt
  unitPrice
  quantity
}

fragment ShoppingCartItemWithCart on ShoppingCartItems {
  id
  shoppingCartId
  shoppingCart {
    ...ShoppingCart
  }
  productId
  product {
    ...Product
  }
  createdAt
  unitPrice
  quantity
}

fragment ShoppingCart on ShoppingCarts {
  id
  userId
  orderId
  shoppingCartItemsCollection {
    edges {
      node {
        ...ShoppingCartItem
      }
    }
  }
  createdAt
}

fragment OrderItem on OrderItems {
  id
  productId
  product {
    ...Product
  }
  orderId
  createdAt
  unitPrice
  quantity
}

fragment OrderTransaction on OrderTransactions {
  id
  amount
  orderId
  ccLast4
  ccCard
  succeeded
  error
  payerTransactionId
  createdAt
}

fragment Order on Orders {
  id
  userId
  user {
    ...User
  }
  orderStatus
  orderItemsCollection {
    edges {
      node {
        ...OrderItem
      }
    }
  }
  orderTransactionsCollection {
    edges {
      node {
        ...OrderTransaction
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
  deliveryAddress
  deliveryCity
  deliveryZip
  deliveryLocationName
  deliveryAddress1
  notes
  updatedAt
  createdAt
}

query Order($id: UUID!) {
  ordersCollection(filter: { id: { eq: $id } }) {
    edges {
      node {
        ...Order
      }
    }
  }
}

query OrderCollection(
  $first: Int
  $last: Int
  $before: Cursor
  $after: Cursor
  $filter: OrdersFilter
  $orderBy: [OrdersOrderBy!]
) {
  ordersCollection(
    first: $first
    last: $last
    before: $before
    after: $after
    filter: $filter
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...Order
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

mutation CreateOrder($input: OrdersInsertInput!) {
  insertIntoOrdersCollection(objects: [$input]) {
    records {
      ...Order
    }
    affectedCount
  }
}

mutation UpdateOrder($id: UUID!, $input: OrdersUpdateInput!) {
  updateOrdersCollection(
    filter: { id: { eq: $id } }
    set: $input
  ) {
    records {
      ...Order
    }
    affectedCount
  }
}

mutation DeleteOrder($id: UUID!) {
  deleteFromOrdersCollection(filter: { id: { eq: $id } }) {
    affectedCount
  }
}

query OrderTransactionCollection(
  $first: Int
  $last: Int
  $before: Cursor
  $after: Cursor
  $filter: OrderTransactionsFilter
  $orderBy: [OrderTransactionsOrderBy!]
) {
  orderTransactionsCollection(
    first: $first
    last: $last
    before: $before
    after: $after
    filter: $filter
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...OrderTransaction
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}


