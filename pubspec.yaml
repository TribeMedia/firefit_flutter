name: firefit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  atproto: ^1.0.0-preview.4
  bluesky: ^1.0.0-preview.8
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shadcn_ui:
    git: https://github.com/GQAdonis/flutter-shadcn-ui.git
  hooks_riverpod: ^2.6.1
  core:
    path: ./packages/core
  riverpod_annotation: ^2.6.1
  talker_flutter: ^4.7.1
  dio: ^5.8.0+1
  envied: ^1.1.1
  flutter_markdown: ^0.7.6+2
  reactive_dropdown_search: ^5.0.5
  lottie: ^3.3.1
  http_parser: ^4.1.2
  file_picker: ^9.1.0
  awesome_snackbar_content: ^0.1.5
  equatable: ^2.0.7
  supabase_flutter: ^2.8.4
  reactive_forms: ^17.0.1
  reactive_forms_annotations: ^6.0.0
  flutter_gravatar: ^2.0.2
  google_fonts: ^6.2.1
  adaptive_theme: ^3.7.0
  go_router: ^14.8.1
  icons_plus: ^5.0.0
  markdown: ^7.3.0
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^9.2.4
  collection: ^1.19.1
  badges: ^3.1.2
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  path: ^1.9.1
  fpdart: ^1.1.1
  talker_dio_logger: ^4.7.1
  supabase_auth_ui: ^0.5.4
  uuid: ^4.5.1
  awesome_flutter_extensions: ^1.3.0
  dropdown_search: ^6.0.4-pre
  dropdown_button2: ^3.0.0-beta.19
  carousel_slider: ^5.0.0
  toggle_list: ^0.3.1
  toggle_switch: ^2.3.0
  forui: ^0.10.0+1
  logging: ^1.3.0
  provider: ^6.1.2
  openai_dart: ^0.4.5
  flutter_highlight: ^0.7.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  timeago: ^3.7.0
  loading_animation_widget: ^1.3.0
  flutter_animate: ^4.5.2
  google_nav_bar: ^5.0.7
  graphql: ^5.2.0-beta.11
  graphql_flutter: ^5.2.0-beta.8
  skeletonizer: ^1.4.3
  connectivity_plus: ^6.1.3
  freezed_annotation: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_hooks: ^0.21.2
  markdown_widget: ^2.3.2+6
  webview_flutter: ^4.10.0
  http: ^1.3.0
  app_links: ^6.4.0
  flutter_stripe: ^11.4.0
  fluttertoast: ^8.2.12
  intl: ^0.20.2
  rxdart: ^0.28.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4

dependency_overrides:
  collection: ^1.19.1
  email_validator: ^3.0.0
  web_socket_channel: ^3.0.2
  xrpc: ^0.6.1
  freezed_annotation: ^3.0.0
  flutter_hooks: ^0.21.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  freezed: ^3.0.3
  go_router_builder: ^2.8.2
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.4
  melos: ^6.3.2
  riverpod_generator: ^2.6.5
  envied_generator: ^1.1.1
  reactive_forms_generator: ^6.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: "assets\/fonts\/Inter\/Inter-VariableFont_slnt,wght.ttf"
    - family: OpenSans
      fonts:
        - asset: "assets\/fonts\/Open_Sans\/OpenSans-Italic-VariableFont_wdth,wght.ttf"
        - asset: "assets\/fonts\/Open_Sans\/OpenSans-VariableFont_wdth,wght.ttf"
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/otf/Geist-Regular.otf
          weight: 400
        - asset: assets/fonts/Geist/otf/Geist-Medium.otf
          weight: 500
        - asset: assets/fonts/Geist/otf/Geist-Bold.otf
          weight: 700
        - asset: assets/fonts/Geist/otf/Geist-Light.otf
          weight: 300
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono/otf/GeistMono-Regular.otf
          weight: 400
        - asset: assets/fonts/GeistMono/otf/GeistMono-Medium.otf
          weight: 500
        - asset: assets/fonts/GeistMono/otf/GeistMono-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/app.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/app.png"
